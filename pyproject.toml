[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-app-template"
version = "0.1.0"
description = "一键生成生产级 AI 应用项目骨架：模型网关、降级兜底、成本路由、可观测性、自动化评测，开箱即用。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "任慧荣", email = "renhuirongllm@163.com" }]
keywords = [
    "llm", "ai", "agent", "langgraph", "scaffold",
    "template", "cli", "fastapi", "observability", "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/shuijing-ai/ai-app-template"
Documentation = "https://github.com/shuijing-ai/ai-app-template/tree/main/docs"
Changelog = "https://github.com/shuijing-ai/ai-app-template/blob/main/CHANGELOG.md"

[project.scripts]
ai-app-template = "ai_app_template.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_app_template"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/ai_app_template/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003：中文全角标点在中文项目里是预期写法；B008：typer.Option 默认参数是官方惯例
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "build", "dist", "src/ai_app_template/templates", "demo-app"]
